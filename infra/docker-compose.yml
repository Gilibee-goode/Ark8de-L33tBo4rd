# -----------------------------------------------------------------
# docker-compose.yml — Local development environment (Phase 3)
# -----------------------------------------------------------------
# The monolith is split into microservices. Start everything with:
#   docker compose -f infra/docker-compose.yml up --build
#
# Topology:
#   postgres     — shared PostgreSQL database
#   nats         — NATS JetStream (async events between services)
#   migrate      — one-shot: applies db/migrations then exits
#   auth-service        :8081 (internal)  /auth/*
#   player-service      :8082 (internal)  /api/players/*, /api/skills
#   team-service        :8083 (internal)  /api/teams/*
#   leaderboard-service :8084 (internal)  /api/leaderboard/*
#   frontend-service    :8085 (internal)  HTML pages, /static
#   gateway             :8080 (published) single entry point → routes to all
#   pgadmin      :5050 — DB browser (dev only)
# -----------------------------------------------------------------

# Shared env for every Go service — YAML anchor to avoid repetition.
x-service-env: &service-env
  DATABASE_URL: postgres://ark8de:ark8de_dev@postgres:5432/ark8de?sslmode=disable
  JWT_SECRET: local-dev-secret-change-me-in-production
  NATS_URL: nats://nats:4222

services:

  postgres:
    image: postgres:16-alpine
    container_name: ark8de-postgres
    environment:
      POSTGRES_DB: ark8de
      POSTGRES_USER: ark8de
      POSTGRES_PASSWORD: ark8de_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark8de -d ark8de"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # NATS with JetStream enabled (-js) and the HTTP monitoring port (-m 8222)
  # which doubles as the healthcheck endpoint.
  nats:
    image: nats:2-alpine
    container_name: ark8de-nats
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot migration job: runs `migrate up` and exits 0.
  # Services below wait for it via service_completed_successfully.
  migrate:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: migrate }
    container_name: ark8de-migrate
    command: ["/app/service", "up"]
    environment:
      DATABASE_URL: postgres://ark8de:ark8de_dev@postgres:5432/ark8de?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: auth-service }
    container_name: ark8de-auth
    environment:
      <<: *service-env
      PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  player-service:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: player-service }
    container_name: ark8de-player
    environment:
      <<: *service-env
      PORT: "8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

  team-service:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: team-service }
    container_name: ark8de-team
    environment:
      <<: *service-env
      PORT: "8083"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-service:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: leaderboard-service }
    container_name: ark8de-leaderboard
    environment:
      <<: *service-env
      PORT: "8084"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

  frontend-service:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: frontend-service }
    container_name: ark8de-frontend
    environment:
      <<: *service-env
      PORT: "8085"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: monolith/Dockerfile
      args: { SERVICE: gateway }
    container_name: ark8de-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: local-dev-secret-change-me-in-production
      AUTH_SERVICE_URL: http://auth-service:8081
      PLAYER_SERVICE_URL: http://player-service:8082
      TEAM_SERVICE_URL: http://team-service:8083
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:8084
      FRONTEND_SERVICE_URL: http://frontend-service:8085
    depends_on:
      - auth-service
      - player-service
      - team-service
      - leaderboard-service
      - frontend-service
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ark8de-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ark8de.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
